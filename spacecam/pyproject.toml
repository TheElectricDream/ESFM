[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esfm-simulator"
version = "0.1.0"
description = "Desktop spacecraft event-camera simulation with Blender and ESIM"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "h5py>=3.12,<4", "scipy>=1.14,<2", "Pillow>=11,<13", "trimesh>=4.6,<5", "PySide6>=6.8,<7", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
step = ["cadquery>=2.5,<3"]

[project.scripts]
esfm-simulator = "spacecam.cli:launch"
esfm-render = "spacecam.cli:main"

[tool.setuptools.packages.find]
include = ["spacecam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
